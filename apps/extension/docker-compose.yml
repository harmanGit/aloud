services:
  extension-build:
    image: node:20-bookworm-slim
    working_dir: /workspace/apps/extension
    volumes:
      - .:/workspace/apps/extension
    command: sh -lc "npm install && npm run build"

  extension-watch:
    image: node:20-bookworm-slim
    working_dir: /workspace/apps/extension
    volumes:
      - .:/workspace/apps/extension
    command: sh -lc "npm install && npm run watch"
