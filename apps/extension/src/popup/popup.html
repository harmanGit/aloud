<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aloud</title>
    <link rel="stylesheet" href="common.css" />
</head>

<body class="popup-page">
    <main class="panel">
        <h1>Aloud</h1>
        <p class="hint">Extract readable text from this tab and send it to your API.</p>

        <div class="actions main-actions">
            <button id="saveLocal" type="button" class="primary">Save to Local</button>
            <span id="cloudActionWrap" class="tooltip-wrap">
                <button id="saveCloud" type="button" aria-describedby="cloudTooltip">Save to Cloud</button>
                <span id="cloudTooltip" class="tooltip-bubble" role="tooltip">
                    S3 location must be set in Options to enable Save to Cloud.
                </span>
            </span>
            <button id="openOptions" type="button" class="ghost icon-button" aria-label="Open options"
                title="Open options">
                ⚙
            </button>
        </div>

        <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
</body>

</html>
