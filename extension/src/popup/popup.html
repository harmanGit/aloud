<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aloud</title>
    <link rel="stylesheet" href="common.css" />
</head>

<body class="popup-page">
    <main class="panel">
        <h1>Aloud</h1>
        <p class="hint">Extract readable text from this tab and send it to your API.</p>

        <div class="actions main-actions">
            <button id="playAction" type="button" class="primary icon-button" aria-label="Play" title="Play">
                ▶
            </button>
            <button id="saveAction" type="button" class="primary icon-button" aria-label="Save" title="Save">
                ⭳
            </button>
            <button id="openOptions" type="button" class="ghost icon-button" aria-label="Settings" title="Settings">
                ⚙
            </button>
        </div>

        <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
</body>

</html>
